<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>Ache o 67</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: one centered phone-width column. Header with progress dots, a 5x7 board of chunky keys, then the final question replaces the board. */
:root {
  --bg: #FFD94A;
  --ink: #1A1630;
  --muted: #5B4E14;
  --tile: #FFF4BE;
  --tile-edge: #D9A914;
  --accent: #E5186A;
  --accent-edge: #A50F4E;
  --accent-ink: #FFFFFF;
  --display: 'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17132B;
    --ink: #FFF1B0;
    --muted: #B7AEE6;
    --tile: #2A2450;
    --tile-edge: #0C0919;
    --accent: #FF5C93;
    --accent-edge: #B02B5F;
    --accent-ink: #1A1630;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17132B;
  --ink: #FFF1B0;
  --muted: #B7AEE6;
  --tile: #2A2450;
  --tile-edge: #0C0919;
  --accent: #FF5C93;
  --accent-edge: #B02B5F;
  --accent-ink: #1A1630;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.app {
  width: 100%;
  max-width: 440px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  padding-top: 8px;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(34px, 10vw, 48px);
  line-height: 1;
  letter-spacing: -0.02em;
}
h1 .n { color: var(--accent); }
.progress { display: flex; gap: 8px; padding-bottom: 6px; }
.dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  transition: background-color .2s;
}
.dot.on { background: var(--accent); border-color: var(--accent); }

.status {
  margin: 0;
  min-height: 1.4em;
  font-weight: 600;
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding-bottom: 4px;
}
.grid.locked { pointer-events: none; }
.key {
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: var(--tile);
  color: var(--ink);
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(20px, 6.2vw, 28px);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 4px 0 var(--tile-edge);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tile-edge); }
.key:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.key.hit { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-edge); animation: pop .35s ease-out; }
.key.miss { opacity: .45; animation: shake .3s; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.final { display: flex; flex-direction: column; gap: 18px; padding-top: 16px; }
.kicker {
  margin: 0;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.final h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(52px, 17vw, 76px);
  line-height: .95;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
.final p.lead { margin: 0; font-size: 18px; line-height: 1.45; max-width: 32ch; }

.answers { position: relative; height: 250px; margin-top: 8px; }
.answers button, .wa {
  font-family: var(--display);
  font-weight: 800;
  font-size: 22px;
  padding: 16px 34px;
  border: 0;
  border-radius: 14px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.answers button { position: absolute; top: 24px; }
.yes {
  left: 0;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 5px 0 var(--accent-edge);
  transform-origin: left top;
  transition: transform .25s cubic-bezier(.3, 1.4, .5, 1);
}
.no {
  right: 0;
  background: var(--tile);
  color: var(--ink);
  box-shadow: 0 5px 0 var(--tile-edge);
  transition: left .18s ease-out, top .18s ease-out;
}
.answers button:focus-visible, .wa:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.wa {
  display: inline-block;
  align-self: flex-start;
  text-decoration: none;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 5px 0 var(--accent-edge);
}

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

@media (prefers-reduced-motion: reduce) {
  .key.hit, .key.miss { animation: none; }
  .yes, .no { transition: none; }
}
</style>
</head>
<body>

<main class="app">
  <header>
    <h1>Ache o <span class="n">67</span></h1>
    <div class="progress" id="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </header>

  <p id="status" class="status" aria-live="polite"></p>
  <div id="grid" class="grid" role="group" aria-label="Números"></div>

  <section id="final" class="final" hidden>
    <p class="kicker">Três de três</p>
    <h2>Bora sair, Alice?</h2>
    <p class="lead">Você tem olho bom. Agora só falta responder.</p>
    <div class="answers" id="answers">
      <button type="button" class="yes" id="yes">Sim</button>
      <button type="button" class="no" id="no">Não</button>
    </div>
  </section>

  <section id="done" class="final" hidden>
    <p class="kicker">Resposta certa</p>
    <h2>Combinado.</h2>
    <p class="lead">Perfeito, dona Alice, agora você só precisa me avisar que aceitou (ia dar muito trabalho fazer o site me notificar).</p>
    <a id="wa" class="wa" href="#" target="_blank" rel="noopener" hidden>Chamar no WhatsApp</a>
  </section>
</main>
<canvas id="confetti"></canvas>

<script>
(function () {
  // Para o botão de WhatsApp aparecer, coloque o número com país e DDD, só dígitos. Exemplo: "5511999999999"
  var WHATSAPP = "";
  var MENSAGEM = "Achei o 67 três vezes e disse sim";

  var TOTAL = 3, COLS = 5, ROWS = 7;
  var DECOYS = [76, 57, 69, 66, 77, 87, 65, 68, 47, 16, 61, 62, 36, 26, 56, 86, 96, 6, 7, 60, 70];

  function $(id) { return document.getElementById(id); }
  function rand(n) { return Math.floor(Math.random() * n); }

  var grid = $('grid'), statusEl = $('status'), dots = document.querySelectorAll('.dot');
  var found = 0;

  function buildRound() {
    var size = COLS * ROWS, nums = [];
    while (nums.length < size) {
      var n = Math.random() < 0.35 ? DECOYS[rand(DECOYS.length)] : 10 + rand(90);
      if (n !== 67) nums.push(n);
    }
    nums[rand(size)] = 67;
    grid.innerHTML = '';
    nums.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'key';
      b.textContent = n;
      b.dataset.n = n;
      grid.appendChild(b);
    });
  }

  function setStatus() {
    var left = TOTAL - found;
    if (found === 0) statusEl.textContent = 'Toque no 67. Ache ' + TOTAL + ' vezes.';
    else statusEl.textContent = 'Achou. ' + (left === 1 ? 'Falta 1.' : 'Faltam ' + left + '.');
    dots.forEach(function (d, i) { d.classList.toggle('on', i < found); });
  }

  grid.addEventListener('click', function (e) {
    var key = e.target.closest('.key');
    if (!key || grid.classList.contains('locked')) return;
    if (key.dataset.n === '67') {
      found++;
      key.classList.add('hit');
      grid.classList.add('locked');
      setStatus();
      setTimeout(function () {
        grid.classList.remove('locked');
        if (found < TOTAL) buildRound(); else showFinal();
      }, 700);
    } else {
      key.classList.remove('miss');
      void key.offsetWidth;
      key.classList.add('miss');
    }
  });

  function showFinal() {
    grid.hidden = true;
    statusEl.hidden = true;
    $('final').hidden = false;
  }

  /* Botão "Não" que foge, "Sim" que cresce */
  var answers = $('answers'), yes = $('yes'), no = $('no'), scale = 1;

  function dodge() {
    scale = Math.min(scale + 0.12, 1.7);
    yes.style.transform = 'scale(' + scale + ')';

    var W = answers.clientWidth, H = answers.clientHeight;
    var w = no.offsetWidth, h = no.offsetHeight;
    var sx = yes.offsetLeft, sy = yes.offsetTop;
    var sw = yes.offsetWidth * scale, sh = yes.offsetHeight * scale;
    var cx = no.offsetLeft, cy = no.offsetTop;
    var pad = 14;

    for (var i = 0; i < 40; i++) {
      var x = Math.random() * (W - w), y = Math.random() * (H - h);
      var overlaps = x < sx + sw + pad && x + w > sx - pad && y < sy + sh + pad && y + h > sy - pad;
      var far = Math.hypot(x - cx, y - cy) > 90;
      if (!overlaps && far) { place(x, y); return; }
    }
    place(W - w, H - h);
  }
  function place(x, y) {
    no.style.right = 'auto';
    no.style.left = x + 'px';
    no.style.top = y + 'px';
  }

  no.addEventListener('pointerdown', function (e) { e.preventDefault(); dodge(); });
  no.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') dodge(); });
  no.addEventListener('click', function (e) { e.preventDefault(); dodge(); });

  yes.addEventListener('click', function () {
    $('final').hidden = true;
    $('done').hidden = false;
    if (WHATSAPP) {
      var a = $('wa');
      a.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MENSAGEM);
      a.hidden = false;
    }
    confetti();
  });

  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c = $('confetti'), ctx = c.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.scale(dpr, dpr);
    var colors = ['#E5186A', '#FFD94A', '#1A1630', '#FFFFFF', '#3DDC97'];
    var ps = [];
    for (var i = 0; i < 90; i++) {
      ps.push({
        x: W / 2, y: H * 0.55,
        vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4,
        s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        c: colors[rand(colors.length)]
      });
    }
    var t = 0;
    (function tick() {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function (p) {
        p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
        ctx.restore();
      });
      if (++t < 150) requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
    })();
  }

  buildRound();
  setStatus();
})();
</script>
</body>
</html>
